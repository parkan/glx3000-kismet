# site override -- loaded last, wins over any same-named option
# (see opt_override in kismet.conf).

# captures go to the storage mounted at /mnt/kismet by /etc/config/fstab
# (microSD labelled 'kismet'); stock log_prefix=./ would land them on the
# tiny flash overlay.
log_prefix=/mnt/kismet/

# geotag captures from gpsd (VK-172 u-blox7 on USB -> /dev/ttyACM0 -> gpsd).
# reconnect=true so kismet keeps retrying if gpsd/GPS come up after kismet.
gps=gpsd:host=localhost,port=2947,reconnect=true
